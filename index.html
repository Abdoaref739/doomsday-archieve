<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Doomsday Archieve</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="logo-div">
            <img src="./images/logo1.png" class="logo1">
            <img src="./images/logo2.png" class="logo2">
        </div>
        <div class="timer-box">
            <div>
                <span class="time-span months">0</span>

            </div>
            <div>
                <span class="time-span days">33</span>
                <span>Days</span>
            </div>
            <div>
                <span class="time-span hours"></span>
                <span>Hours</span>
            </div>
            <div>
                <span class="time-span minutes">34</span>
                <span>Minutes</span>
            </div>
            <div>
                <span class="time-span seconds"></span>
                <span>Seconds</span>
            </div>
        </div>
    </div>

    <div class="trailers-section">
        <div class="final-trailer-div">
            <h2>Final trailer just dropped!</h2>
            
            
            <iframe
            height="315"
            src="https://www.youtube.com/embed/Wb8Tq_HD4E8"
            title="Avengers: Doomsday | Final Trailer"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
            </iframe>

            <div class="characters-section">
            <h2>MCU's main characters</h2>


            <div class="item doom">
                        <img src="./images/doom.jpg">
                    </div>



            <div class="avengers char">
                <img src="./images/logo1.png">

                <div class="carousel">
                    <div class="item">
                        <img src="./images/steve.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/thor.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/sam.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/antman.jpg">
                    </div>
                </div>


            </div>





            <div class="x-men char">
                <img src="./images/X-Men_logo.svg.webp">

                <div class="carousel">
                    <div class="item">
                        <img src="./images/ccyclops.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/xavier.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/magneto.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/mystique.jpg">
                    </div>
                </div>


            </div>


            <div class="fantastic-four char">
                <img src="./images/the-fantastic-four-first-steps-logo-png_seeklogo-550020-removebg-preview.png">

                <div class="carousel">
                    <div class="item">
                        <img src="./images/mr-fantastic.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/sue-storm.jpg">
                    </div>
                     <div class="item">
                        <img src="./images/the-thing.jpg">
                    </div>
                </div>


            </div>


            <div class="new-avengers char">
                <img src="./images/the_new_avengers_logo.png">

                <div class="carousel">
                    <div class="item">
                        <img src="./images/yelena.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/red-gardian.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/sentry.jpg">
                    </div>
                    <div class="item">
                        <img src="./images/mystique.jpg">
                    </div>
                </div>


            </div>





        </div>

        </div>
    </div>
    <script>
        let daysCountdown = document.querySelector(".days");
        let hoursCountdown = document.querySelector(".hours");
        let minutesCountdown = document.querySelector(".minutes");
        let secondsCountdown = document.querySelector(".seconds");
        setInterval(function countdown(){
    countDownTime = new Date("Dec 17, 2026 23:59:59").getTime();
    currentDate = new Date().getTime();
    dateDiff = countDownTime - currentDate;





    let days = Math.floor(dateDiff / (1000 * 60 * 60 * 24));
    daysCountdown.innerHTML = days;
    let hours = Math.floor((dateDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    hoursCountdown.innerHTML = hours;
    let minutes = Math.floor(dateDiff % (1000 * 60 * 60) / (1000 * 60));
    minutesCountdown.innerHTML = minutes;
    let seconds = Math.floor(dateDiff % (1000 * 60) / (1000));
    secondsCountdown.innerHTML = seconds;
    if (days <= 0 && hours <= 0 && minutes <= 0 && seconds <= 0){
    clearInterval(countdown());
    hoursCountdown.innerHTML = "0";
}
}, 1000);
    </script>
</body>
</html>
